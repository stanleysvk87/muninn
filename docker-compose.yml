services:
  muninn:
    build: .
    ports:
      - "${MUNINN_PORT:-8000}:8000"
    environment:
      MUNINN_ENCRYPTION_KEY: ${MUNINN_ENCRYPTION_KEY}
      MUNINN_COOKIE_SECURE: ${MUNINN_COOKIE_SECURE:-true}
      MUNINN_AI_PROVIDER_MODE: ${MUNINN_AI_PROVIDER_MODE:-auto}
      MUNINN_ANTHROPIC_API_KEY: ${MUNINN_ANTHROPIC_API_KEY:-}
      HOME: /home/muninn
    volumes:
      - ${MUNINN_DATA_HOST_PATH:-./data}:/app/data
      - ${MUNINN_ARCHIVE_HOST_PATH:-./archive}:/app/archive
      # Reuse the host's claude CLI login instead of an API key (only works
      # because this container runs on the same aarch64 host — see
      # INSTALL.md for the tradeoffs vs. the API-key path). The container
      # runs as non-root (UID 1000) because claude refuses
      # --dangerously-skip-permissions as root.
      - ${HOME}/.claude:/home/muninn/.claude:ro
      - ${MUNINN_CLAUDE_BIN_HOST_PATH}:/usr/local/bin/claude:ro
      - /mnt/storage/data/claude-global:/mnt/storage/data/claude-global:ro
    restart: unless-stopped
